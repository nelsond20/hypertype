<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>HyperType</title>
  <defs>
    <linearGradient id="cap" x1="32" y1="2" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6573ff" />
      <stop offset="1" stop-color="#2633d4" />
    </linearGradient>
    <linearGradient id="dish" x1="32" y1="9" x2="32" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c26a8" />
      <stop offset="1" stop-color="#3a49ee" />
    </linearGradient>
  </defs>
  <!-- side wall of the key -->
  <rect x="3" y="9" width="58" height="52" rx="15" fill="#0f1670" />
  <!-- top of the key -->
  <rect x="3" y="3" width="58" height="52" rx="15" fill="url(#cap)" />
  <rect x="3.75" y="3.75" width="56.5" height="50.5" rx="14.25" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.5" />
  <!-- dished surface -->
  <rect x="10" y="9" width="44" height="40" rx="10" fill="url(#dish)" />
  <rect x="10.5" y="9.5" width="43" height="39" rx="9.5" stroke="#000" stroke-opacity=".28" stroke-width="1" />
  <!-- engraved H -->
  <path d="M18.5 19.5V38.5M32.5 19.5V38.5M18.5 29H32.5" stroke="#ffffff" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- the cursor -->
  <rect x="37.5" y="34" width="10.5" height="5.5" rx="2.75" fill="#c6d84a" />
</svg>
